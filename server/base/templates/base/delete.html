{% extends 'main.html' %}
{% block title %}Confirm delete — Study Buddy{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="card card--pad">
      <div class="empty" style="padding-bottom:8px">
        <div class="empty__art" style="color:var(--danger-fg);background:var(--danger-bg);border-color:var(--danger-bd)">
          <svg class="ic ic--lg"><use href="#i-trash"/></svg>
        </div>
        <h3>Delete this item?</h3>
        <p>“{{ obj }}” will be permanently removed. This can't be undone.</p>
      </div>
      <form method="POST" class="form__actions" style="justify-content:center">
        {% csrf_token %}
        <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn--ghost">Cancel</a>
        <button class="btn btn--danger" type="submit">Yes, delete</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
